<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tối ưu lộ trình giao hàng</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="o1" id="banDo">
            <div class="map-zoom" id="mapZoom"></div>
            <div class="dieukhien">
                <button id="phongto" type="button" aria-label="Phóng to">+</button>
                <button id="thunho" type="button" aria-label="Thu nhỏ">-</button>
                <button id="vekho" type="button" aria-label="Về Kho">⟲</button>
            </div>
        </div>
        <div class="o2">
            <h2>Vùng thiết lập</h2>

            <section class="khoi">
                <h3>1. Chế độ thao tác trên bản đồ</h3>
                <div class="nhom-nut">
                    <button type="button" id="nutTaoDiem">Tạo điểm giao hàng</button>
                    <button type="button" id="nutHuyDiem">Hủy điểm</button>
                </div>
            </section>

            <section class="khoi">
                <hr>
                <h3>2. Đánh dấu tuyến đường đặc biệt</h3>
                <div class="nhom-nut">
                    <button type="button" id="nutCaoDiem">Giờ cao điểm</button>
                    <button type="button" id="nutNgap">Ngập lụt</button>
                </div>
                <p id="thongBao" class="thong-bao" aria-live="polite"></p>
                <p id="soLieuThietLap" class="ghi-chu"></p>
            </section>

            <section class="khoi">
                <hr>
                <h3>3. Hành động</h3>
                <label class="tuy-chon">
                    <input type="checkbox" id="chkQuayVe">
                    Quay về Kho sau khi giao xong
                </label>
                <div class="nhom-nut">
                    <button type="button" id="nutTimDuong" class="nut-chinh">Tìm lộ trình</button>
                    <button type="button" id="nutDatLai">Đặt lại</button>
                </div>
            </section>

           
        </div>

        <div class="o3">
            <h2>Vùng kết quả <span id="trangThaiKetQua" class="trang-thai">Sẵn sàng</span></h2>

            <div class="so-lieu">
                <div class="o-so-lieu"><span class="nhan-so">Quãng đường</span><b id="kqQuangDuong">—</b></div>
                <div class="o-so-lieu"><span class="nhan-so">Thời gian</span><b id="kqThoiGian">—</b></div>
                <div class="o-so-lieu"><span class="nhan-so">Vận tốc</span><b id="kqVanToc">30 km/h</b></div>
            </div>

            <h3>Thứ tự ghé các điểm</h3>
            <div id="kqThuTu" class="thu-tu"><p class="ghi-chu">Chưa tính lộ trình.</p></div>
            <p id="kqCanhBao" class="canh-bao"></p>
        </div>
    </div>

    <script src="data/ban-do.js"></script>
    <script src="js/dothi.js"></script>
    <script src="js/thuattoan.js"></script>
    <script src="js/map.js"></script>
    <script src="js/ketqua.js"></script>
    <script src="js/thietlap.js"></script>
</body>

</html>
